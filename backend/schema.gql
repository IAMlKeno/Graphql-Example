# The "Query" type is the root of all GraphQL queries
type Query {
  greeting: String
  # Get all books
  books: [Book!]!
  # Get a specific book by ID
  book(id: ID!): Book
  # Search books by title or author
  searchBooks(query: String!): [Book!]!
  users: [User]
  user(id: String!): User
  userByEmail(email: String!): User
  quotes(type: String): [Quote]
  quote(id: String!): Quote
  quotesByUser(ownerid: String!): [Quote]
  incompleteQuotesForUser(ownerid: String!): [Quote]
  incompleteQuote(id: String!): Quote
}

type User {
  id: ID!
  fname: String
  lname: String
  dob: String
  email: String!
}

input UserInput {
  fname: String!
  lname: String!
  dob: String!
  email: String!
}

# A book has a title, author, and publication year
type Book {
  id: ID!
  title: String!
  author: String!
  year: Int
  genre: String
}

# Input type for adding/updating books
input BookInput {
  title: String
  author: String
  year: Int
  genre: String
}

# Enum value
enum InsuranceType {
  automotive
  home
  life
}
type Quote {
  id: ID!
  insurance_type: InsuranceType
  date_submitted: String
  estimate: Float!
  ownerid: String
}

input QuoteInput {
  insurance_type: InsuranceType
  estimate: Float!
  ownerid: String
}

type Mutation {
  addBook(input: BookInput!): Book!
  updateBook(id: ID!, input: BookInput!): Book
  deleteBook(id: ID!): Boolean
  addQuote(quote: QuoteInput!): Quote!
  updateQuote(id: ID!, quote: QuoteInput!): Quote
  deleteQuote(id: ID!): Boolean
  addIncompleteQuote(quote: QuoteInput!): Quote
  updateIncompleteQuote(id: ID!, quote: QuoteInput!): Boolean
  deleteIncompleteQuote(id: ID!): Boolean
  addUser(user: UserInput!): User!
  updateUser(id: ID!, user: UserInput!): User
  deleteUser(id: ID!): Boolean
}
